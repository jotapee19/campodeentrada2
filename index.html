<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Alterar Cor de Fundo</title>
  <style>
    body {
      transition: background-color 0.3s ease;
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    input {
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>Digite uma cor</h1>
  <input type="text" id="corInput" placeholder="Ex: red, blue, #ff0000" />

  <script>
    const input = document.getElementById('corInput');

    input.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        document.body.style.backgroundColor = input.value;
      }
    });
  </script>

</body>
</html>
